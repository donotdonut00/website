<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 날씨 & 미세먼지 모니터링</title>
  <link rel="shortcut icon" href="#">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%);
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .dashboard-container {
      width: 100%;
      max-width: 900px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      gap: 15px;
      flex-wrap: wrap;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
    }

    .search-box {
      display: flex;
      gap: 8px;
      flex: 1;
      max-width: 400px;
    }

    .search-box input {
      flex: 1;
      padding: 12px 18px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-box input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .search-box button {
      padding: 12px 20px;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .search-box button:hover {
      background-color: #2563eb;
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 25px;
    }

    @media (max-width: 640px) {
      .grid-container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #f1f5f9;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
    }

    .card-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .city-header {
      text-align: center;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .city-name {
      font-size: 1.8rem;
      font-weight: 800;
      color: #0f172a;
    }

    .weather-status {
      font-size: 1.2rem;
      font-weight: 600;
      color: #2563eb;
    }

    .temp-main {
      font-size: 2.2rem;
      font-weight: 800;
      margin: 10px 0;
      color: #1e293b;
    }

    .sub-info {
      font-size: 0.9rem;
      color: #64748b;
    }

    .air-status-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 15px;
      background-color: #f8fafc;
    }

    .dust-details {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #f1f5f9;
      padding-top: 12px;
      margin-top: 10px;
    }

    .dust-item {
      text-align: center;
    }

    .dust-item span {
      display: block;
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .dust-item strong {
      font-size: 1.1rem;
      color: #334155;
    }

    #map {
      width: 100%;
      height: 380px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      overflow: hidden;
    }
  </style>

  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=e2c909e34df166a8fb53b7b4af06a652&libraries=services&autoload=false"></script>
</head>
<body>

  <div class="dashboard-container">
    <!-- 상단 헤더 & 검색바 -->
    <div class="header">
      <h1>🌤️ 날씨 & 공기질 모니터링</h1>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="도시명 입력 (예: 서울, 용인, 강릉, 제주...)">
        <button id="search-btn">검색</button>
      </div>
    </div>

    <!-- 정보 카드 그리드 -->
    <div class="grid-container">
      <!-- 실시간 날씨 카드 -->
      <div class="card">
        <div class="card-title">Current Weather</div>
        <div class="city-header">
          <div class="city-name" id="city-name">서울특별시</div>
          <div class="weather-status" id="weather-status">맑음 ☀️</div>
        </div>
        <div class="temp-main" id="temperature">0°C</div>
        <div class="sub-info" id="humidity">습도: - % | 풍속: - km/h</div>
      </div>

      <!-- 대기질 상태 카드 -->
      <div class="card">
        <div class="card-title">Air Quality</div>
        <div class="air-status-badge" id="air-status">대기 상태: -</div>
        <div class="dust-details">
          <div class="dust-item">
            <span>미세먼지(PM10)</span>
            <strong id="pm10">- µg/m³</strong>
          </div>
          <div class="dust-item">
            <span>초미세먼지(PM2.5)</span>
            <strong id="pm25">- µg/m³</strong>
          </div>
        </div>
      </div>
    </div>

    <!-- 지도 영역 -->
    <div id="map"></div>
  </div>

  <script src="mjsec.js"></script>
</body>
</html>
